meta:
  name: ppi_interface
  title: Protein-protein interface (two chains within radius to pick interface residues + sticks + translucent surface)
  scene: Two chains (chain A / chain B) as cartoon background, pick interface residues by within radius (byres within), render interface residues as sticks + CA spheres, translucent molecular surface on both sides, white bg soft light. Suitable for PPI binding interface analysis.
  reference: "Adapted from PyMolClaw ppi.py, rewritten for the 2.5.0 strict API"
  created: 2026-09-19
  created_by: user-sedimented

params:
  object: "{mol}"
  chain_a: "A"
  chain_b: "B"
  within_cutoff: 4.0
  color_a: lightblue
  color_b: lightorange
  interface_spheres: true
  add_interface_surface: true
  surface_transparency: 0.6
  hide_water: true
  hide_hetatm: true
  background: white
  ambient: 0.5
  two_sided_lighting: 1
  ray_trace_mode: 1
  ray_shadows: 1
  antialias: 2
  depth_cue: 0
  ray_trace_gain: 0.1
  orthoscopic: 1
  cartoon_fancy_helices: 1
  cartoon_smooth_loops: 1
  cartoon_flat_sheets: 1
  cartoon_highlight_color: "grey50"
  focus_zoom: 8
  save_width: 1600
  save_ratio: 1.0
  dpi: 300

render:
  description: |
    No molpub class, direct cmd (see ppi_interface.py reference implementation):
    1. cmd.load; load validation count_atoms("all")>0
    2. white bg soft light param set
    3. remove resn HOH; hide everything, hetatm; hide everything
    4. show cartoon, m; per-chain color (chainA=lightblue, chainB=lightorange, elem C)
    5. Interface residues: select ifaceA (byres chain A within {cutoff} of chain B); select ifaceB (symmetric)
    6. show sticks "sc. and (ifaceA or ifaceB)"; show spheres "n. CA and (ifaceA or ifaceB)"
    7. Interface surface (optional): create surfA / surfB; show surface; set transparency; color per side
    8. orient m; zoom "ifaceA or ifaceB"; ray; png dpi=300
    9. mol.stop()
  entry_class: null
  extra_steps: |
    - **within operator** (`chain A within 4.0 of chain B`) is a PyMOL native distance selection, available in 2.5.0.
    - `byres` extends the interface by residue (not atom-by-atom).
    - To view only the two-chain contact region: `cmd.zoom("ifaceA or ifaceB", focus_zoom)`.
    - Unlike dual_align_rmsd: this template does **no** overlay alignment, only draws the two-chain interface **within a single structure**.
