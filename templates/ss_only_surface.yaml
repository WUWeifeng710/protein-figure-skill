meta:
  name: ss_only_surface
  title: Pure secondary-structure pastel cartoon (no surface, v3)
  scene: Cartoon only, coloured by secondary structure (helix/strand/loop) in pastels; no surface shell; white-bg soft light. Ideal for clean lines with no shell occlusion.
  reference: "User-sedimented .pml recipe (pure ss pastel, no shell; the original recipe_3_ss_only.pml is not distributed within this skill)"
  created: 2026-09-18
  created_by: user-sedimented

params:
  object: "{mol}"
  # This template does not split objects; colours {mol} directly
  custom_colors:
    soft_blue:  [0.63, 0.75, 0.94]   # ss h
    rose_pink:  [0.94, 0.69, 0.75]   # ss s
    lavender:   [0.78, 0.72, 0.84]   # loop
  ss_color_map:
    ss_h: soft_blue
    ss_s: rose_pink
    loop: lavender
  hide_water: true
  hide_hetatm: true
  # Key: no surface
  use_surface: false
  background: white
  ambient: 0.5
  two_sided_lighting: 1
  ray_trace_mode: 1
  ray_shadows: 1
  antialias: 2
  depth_cue: 0
  ray_trace_gain: 0.1
  orthoscopic: 1
  cartoon_fancy_helices: 1
  cartoon_smooth_loops: 1
  cartoon_flat_sheets: 1
  cartoon_highlight_color: "grey50"
  save_width: 1600
  save_ratio: 1.0
  dpi: 300

render:
  description: |
    No molpub class, direct cmd (see ss_only_surface.py reference implementation):
    1. cmd.load object m; set_color three colours (soft_blue/rose_pink/lavender)
    2. White-bg soft-light parameter group (bg_color + set ambient/two_sided_lighting/ray_shadows/cartoon_fancy_helices etc.)
    3. remove resn HOH; hide everything, hetatm; hide everything
    4. show cartoon (no object split, directly on m); colour by ss:
       color soft_blue,  m and ss h
       color rose_pink,  m and ss s
       color lavender,   m and not (ss h or ss s)
    5. orient; ray; png dpi=300
    6. mol.stop()
  entry_class: null
  extra_steps: |
    - Core difference from ss_milky / ss_frosted: no surface, and the cartoon does not split into a cart object (directly show cartoon + colour m).
    - No create cart/surf; orient directly on m.
    - If you want a shell, switch to ss_milky (neutral shell) or ss_frosted (same-colour frosted shell).
