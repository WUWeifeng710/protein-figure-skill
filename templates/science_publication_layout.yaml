meta:
  name: science_publication_layout
  title: Science full-width multi-panel publication layout
  scene: Multiple structure figures / matplotlib panels + text annotations + rotation widgets, composed into a Science full-width (3-column) publication-grade Figure; ideal for main / composite figures.
  reference: "PyMOL-PUB cases/case_1.py (Nature 2-col; this template adapted to Science 3-col)"
  created: 2026-09-18
  created_by: agent-authored

params:
  manuscript_format: Science
  occupied_columns: 3
  aspect_ratio: [1, 1.6]
  mathtext: false
  grid:
    row_number: 2
    column_number: 3
  # Panel layout: for each image / panel, the tuple is (n_row, n_col, order-number)
  # Caller overrides with the actual number of images to embed
  panel_layouts:
    - {image: "{img_1}", layout: [1, 3, 1]}
    - {image: "{img_2}", layout: [2, 3, 2]}
    - {image: "{img_3}", layout: [2, 3, 3]}
  # Text annotations
  texts:
    - {annotation: "(a)", locations: [0.02, 0.97, 0.08, 0.03]}
    - {annotation: "(b)", locations: [0.35, 0.52, 0.08, 0.03]}
  # Widget icons (optional)
  widget_icons:
    - {type: arrow, params: {degree: 90}, locations: [0.85, 0.8, 0.1, 0.1], transparent: true}
  dpi: 300

render:
  description: |
    1. First generate each sub-figure PNG per the nature_highlight / rmsd_compare etc. templates (dpi ≥ 300)
    2. Figure(manuscript_format=Science, occupied_columns=3, aspect_ratio=(1, 1.6),
              mathtext=False, row_number=2, column_number=3)
    3. For each panel_layouts: fig.set_image(image_path, layout=(r, c, n))
    4. For each texts: fig.set_text(annotation, locations)
    5. For each widget_icons: obtain_widget_icon → fig.set_image(image_path, locations, transparent=True)
    6. fig.save_figure(save_path)  # dpi determined by Figure.minimum_dpi (Science=300)
  entry_class: Figure
  extra_steps: |
    - set_image only accepts .png; rasterise SVG/PDF widgets first.
    - Pick one of locations or layout; passing both raises an error.
    - Sub-figure dpi must be ≥ 300, otherwise paste_bitmap raises a ValueError.
