meta:
  name: pastel_cartoon_surface
  title: Pastel chain-coloured cartoon + milky translucent surface
  scene: Single-structure multi-chain; cartoon coloured per chain in pastels + neutral milky translucent surface shell, white-bg soft-light publication grade; ideal for the main figure of a multi-chain composite structure.
  reference: "User-sedimented .pml recipe (pastel cartoon + milky surface; the original recipe.pml is not distributed within this skill)"
  created: 2026-09-18
  created_by: user-sedimented

params:
  # -- object name (recipe default m; override per the PDB loaded object) --
  object: "{mol}"

  # -- object split (key: cart / surf coloured separately so they do not interfere; equivalent to the closed_surface=True idea) --
  cartoon_object: "{mol}_cart"
  surface_object: "{mol}_surf"

  # -- custom pastel palette (RGB 0-1; extend beyond 4 chains yourself) --
  custom_colors:
    soft_blue:  [0.63, 0.75, 0.94]
    rose_pink:  [0.94, 0.69, 0.75]
    lavender:   [0.78, 0.72, 0.84]
    soft_cream: [0.98, 0.93, 0.80]

  # -- chain -> colour mapping (override per the actual PDB chains; add set_color + color for more than 4 chains) --
  chain_color_map:
    A: soft_blue
    B: rose_pink
    C: lavender
    D: soft_cream

  # -- clear stage --
  hide_water: true
  hide_hetatm: true

  # -- surface shell --
  surface_color: "gray90"      # can be swapped for white
  surface_transparency: 0.60   # 0.45 more solid / 0.75 very transparent

  # -- render params (white bg + soft light) --
  background: white
  ambient: 0.5
  two_sided_lighting: 1
  ray_trace_mode: 1
  ray_shadows: 1
  antialias: 2
  depth_cue: 0
  ray_trace_gain: 0.1
  orthoscopic: 1
  cartoon_fancy_helices: 1
  cartoon_smooth_loops: 1
  cartoon_flat_sheets: 1
  cartoon_highlight_color: "grey50"

  # -- output --
  save_width: 1600
  save_ratio: 1.0
  dpi: 300
  manuscript_format: Nature

render:
  description: |
    This recipe exceeds the scope of the molpub standard API (custom set_color palette + create object split + render params).
    The render script **does not use the HighlightStructureImage class**; instead it directly calls molpub's _mol.cmd commands
    (equivalent to running recipe.pml inside PyMOL):
    1. set_color defines 4 pastels (soft_blue / rose_pink / lavender / soft_cream)
    2. bg_color + set ambient/two_sided_lighting/ray_trace_mode/ray_shadows/antialias/
       depth_cue/ray_trace_gain/orthoscopic/cartoon_fancy_helices/cartoon_smooth_loops/
       cartoon_flat_sheets/cartoon_highlight_color
    3. remove resn HOH; hide everything, hetatm; hide everything
    4. create {cartoon_object}, {object}; create {surface_object}, {object}
    5. show cartoon, {cartoon_object}; per-chain color ... and chain X via chain_color_map
    6. show surface, {surface_object}; color {surface_color}; set transparency, {surface_transparency}
    7. orient {cartoon_object}; ray {save_width}
    8. png {save_path}, dpi={dpi}
    9. close() to release the PyMOL process
  entry_class: null   # no molpub class, direct cmd
  extra_steps: |
    - More than 4 chains: first set_color a new custom colour name, then add color ... and chain E/F/...
    - To embed into a publication-grade Figure (Nature 2-col etc.), first generate this PNG (dpi=300),
      then lay it out with the science_publication_layout template; sub-figure dpi must be >= the target journal's minimum_dpi.
    - Difference from nature_highlight: this template uses create object split + render params, pastels are softer;
      nature_highlight uses closed_surface=True + neutral colours 0xF2F2F2/0x2D2F82, a harder style.
