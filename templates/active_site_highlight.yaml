meta:
  name: active_site_highlight
  title: Active site close-up (key residues as sticks + translucent cartoon environment + polar contacts dashes)
  scene: Specify several catalytic/binding residues, take the surrounding environment within an `around` radius as a translucent cartoon, render key residues as sticks + CA spheres, draw polar contacts dashes between residues, white bg soft light. Suitable for highlighting local site mechanism.
  reference: "Adapted from PyMolClaw active_site.py, rewritten for the 2.5.0 strict API"
  created: 2026-09-19
  created_by: user-sedimented

params:
  object: "{mol}"
  key_residues: [35, 52, 62, 63]   # key residue numbers (sample values; caller should change to match the target PDB)
  env_cutoff: 5.0                  # environment radius (Å)
  color_catalytic: green          # key-residue sticks colour
  color_env_cartoon: "green"      # environment cartoon colour (paired with 0.7 transparency)
  env_cartoon_transparency: 0.7
  add_polar_contacts: true         # polar contacts between residues (dist mode=2)
  contact_dash_color: black
  hide_water: true
  hide_hetatm: true
  background: white
  ambient: 0.5
  two_sided_lighting: 1
  ray_trace_mode: 1
  ray_shadows: 1
  antialias: 2
  depth_cue: 0
  ray_trace_gain: 0.1
  orthoscopic: 1
  cartoon_fancy_helices: 1
  cartoon_smooth_loops: 1
  cartoon_flat_sheets: 1
  cartoon_highlight_color: "grey50"
  focus_zoom: 10
  save_width: 1600
  save_ratio: 1.0
  dpi: 300

render:
  description: |
    No molpub class, direct cmd (see active_site_highlight.py reference implementation):
    1. cmd.load; load validation count_atoms("all")>0 (error out on 0 matches)
    2. white bg soft light param set
    3. remove resn HOH; hide everything, hetatm; hide everything
    4. Key residue selection: **select + extend one at a time, then merge** (named selection strict mode does not accept +/or concatenation;
       using `cmd.extend` for selection addition is the most stable)
    5. Environment selection: `cmd.select("cat_env", "byres (catalytic around {env_cutoff}) and not catalytic")`
    6. show cartoon, cat_env; set cartoon_transparency 0.7
    7. show sticks, "sc. and (m and (...))"; show spheres, "n. CA and (...)"; set sphere_scale 0.5
    8. clear stage hides only the "unselected": hide everything, "m and not (catalytic or cat_env)"
    9. polar contacts: cmd.dist("cat_contacts", "catalytic", "catalytic", mode=2) (bonds + H-bonds)
    10. orient catalytic; zoom catalytic, {focus_zoom}; ray; png dpi=300
    11. mol.stop()
  entry_class: null
  extra_steps: |
    - **Core pitfall (verified in practice)**: in conda 2.5.0 the `select` named selection does not accept the `+` operator for concatenation (reports "Invalid selection name");
      `count_atoms` accepts it but `select` does not. Use `cmd.select` + `cmd.extend` for selection addition instead.
    - `byres` depends on the `catalytic` selection still existing; it MUST be done **after** `hide("everything")` (hide clears the selection).
    - polar contacts `dist mode=2` is bonds + H-bonds; if the PDB lacks H atoms (no H-bonds), contact lines may be sparse or absent.
    - Key residue numbers must correspond to residues actually present in the target PDB (validate with count_atoms).
