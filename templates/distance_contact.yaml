meta:
  name: distance_contact
  title: Residue-pair distance / polar contacts annotation (sticks + CA spheres + dist mode=2)
  scene: Select two residues (or two selections), display them as sticks + CA spheres, draw distance dashes + polar contacts (bonds/H-bonds), white bg soft light. Suitable for binding-site distance annotation and inter-residue interactions.
  reference: "Adapted from PyMolClaw distance.py, rewritten for the 2.5.0 strict API"
  created: 2026-09-19
  created_by: user-sedimented

params:
  object: "{mol}"
  sel1: "resi 35"          # first selection (PyMOL selection syntax, may carry a chain prefix)
  sel2: "resi 52"          # second selection
  contact_mode: 2          # dist mode: 0=all, 1=polar, 2=hbond+bond
  add_spheres: true
  sphere_scale: 0.5
  focus_zoom: 12
  hide_water: true
  hide_hetatm: true
  background: white
  ambient: 0.5
  two_sided_lighting: 1
  ray_trace_mode: 1
  ray_shadows: 1
  antialias: 2
  depth_cue: 0
  ray_trace_gain: 0.1
  orthoscopic: 1
  cartoon_fancy_helices: 1
  cartoon_smooth_loops: 1
  cartoon_flat_sheets: 1
  cartoon_highlight_color: "grey50"
  save_width: 1600
  save_ratio: 1.0
  dpi: 300

render:
  description: |
    No molpub class, direct cmd (see distance_contact.py reference implementation):
    1. cmd.load; load validation count_atoms("all")>0
    2. white bg soft light param set
    3. remove resn HOH; hide everything, hetatm; hide everything
    4. show cartoon, m (background cartoon)
    5. select s1/s2 (use the param selections); show sticks "sc. and (s1 or s2)"; show spheres "n. CA and (s1 or s2)"
    6. dist d1, s1, s2, mode={contact_mode}; set dash_color/black/dash_gap/dash_radius
    7. orient s1; zoom "s1 or s2", focus_zoom; ray; png dpi=300
    8. mol.stop()
  entry_class: null
  extra_steps: |
    - In 2.5.0 the `select` named selection does not accept the `+` operator for concatenation; sel1/sel2 are two independent named selections, show sticks uses `sc. and (s1 or s2)` (or is a PyMOL selection operator, works fine).
    - `dist` `mode`: 0=all contacts, 1=polar, 2=bonds+H-bonds.
    - For finer distance value labels, add `cmd.label("d1", '"%.2f A" % dist')` (PyMOL built-in label expression).
