meta:
  name: distance_contact
  title: 残基对距离 / 极性接触标注（sticks + CA 球 + dist mode=2）
  scene: 选两残基（或两个选区）做 sticks + CA 球显示，画距离虚线 + 极性接触（键/氢键），白底柔光。适合结合位点距离标注、残基间相互作用。
  reference: "参考 PyMolClaw distance.py，改写到 2.5.0 严格 API"
  created: 2026-09-19
  created_by: 用户沉淀

params:
  object: "{mol}"
  sel1: "resi 35"          # 第一选区（PyMOL 选区语法，可带链前缀）
  sel2: "resi 52"          # 第二选区
  contact_mode: 2          # dist mode：0=all, 1=polar, 2=hbond+key
  add_spheres: true
  sphere_scale: 0.5
  focus_zoom: 12
  hide_water: true
  hide_hetatm: true
  background: white
  ambient: 0.5
  two_sided_lighting: 1
  ray_trace_mode: 1
  ray_shadows: 1
  antialias: 2
  depth_cue: 0
  ray_trace_gain: 0.1
  orthoscopic: 1
  cartoon_fancy_helices: 1
  cartoon_smooth_loops: 1
  cartoon_flat_sheets: 1
  cartoon_highlight_color: "grey50"
  save_width: 1600
  save_ratio: 1.0
  dpi: 300

render:
  description: |
    不走 molpub 类，直接 cmd（见 distance_contact.py 参考实现）：
    1. cmd.load；加载校验 count_atoms("all")>0
    2. 白底柔光参数一组
    3. remove resn HOH；hide everything, hetatm；hide everything
    4. show cartoon, m（背景卡通）
    5. select s1/s2（用参数选区）；show sticks "sc. and (s1 or s2)"；show spheres "n. CA and (s1 or s2)"
    6. dist d1, s1, s2, mode={contact_mode}；set dash_color/black/dash_gap/dash_radius
    7. orient s1；zoom "s1 or s2", focus_zoom；ray；png dpi=300
    8. mol.stop()
  entry_class: null
  extra_steps: |
    - 2.5.0 里 `select` 命名选区不吃 `+` 运算符拼接；sel1/sel2 是两个独立命名选区，show sticks 用 `sc. and (s1 or s2)`（or 是 PyMOL 选区运算符，能跑）。
    - `dist` 的 `mode`：0=全部接触、1=极性、2=键+氢键。
    - 想要更细的距离值标注，可加 `cmd.label("d1", '\"%.2f A\" % dist')`（PyMOL 内建 label 表达式）。
