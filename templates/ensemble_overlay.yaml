meta:
  name: ensemble_overlay
  title: NMR / MD multi-model overlay (state-based gradient + translucent)
  scene: Overlay display of a multi-model NMR / MD ensemble, rainbow gradient by state + translucent, suitable for showing structural flexibility / conformational ensemble. Single-frame PDB without multiple models degrades to a single-state demo.
  reference: "Adapted from PyMolClaw ensemble.py, rewritten for the 2.5.0 strict API"
  created: 2026-09-19
  created_by: user-sedimented

params:
  object: "{mol}"
  style: cartoon          # cartoon / lines / spheres
  add_spheres: false
  transparency: 0.3
  hide_water: true
  hide_hetatm: true
  background: white
  ambient: 0.5
  two_sided_lighting: 1
  ray_trace_mode: 1
  ray_shadows: 1
  antialias: 2
  depth_cue: 0
  ray_trace_gain: 0.1
  orthoscopic: 1
  cartoon_fancy_helices: 1
  cartoon_smooth_loops: 1
  cartoon_flat_sheets: 1
  cartoon_highlight_color: "grey50"
  save_width: 1600
  save_ratio: 1.0
  dpi: 300

render:
  description: |
    No molpub class, direct cmd (see ensemble_overlay.py reference implementation):
    1. cmd.load; load validation count_atoms("all")>0
    2. white bg soft light param set
    3. remove resn HOH; hide everything, hetatm; hide everything
    4. show {style}, m
    5. spectrum state rainbow m (state-based gradient when multi-model; degrades to single-state for a single frame, the command error can be ignored)
    6. set transparency {transparency}
    7. orient m; ray; png dpi=300
    8. mol.stop()
  entry_class: null
  extra_steps: |
    - **2.5.0 pitfall (hit)**: `spectrum state` reports "Unsupported Ptype for expr: state" in conda 2.5.0 -- for a single-frame PDB without multiple models this command is meaningless; for a multi-model NMR PDB you can try `spectrum state` or switch to `spectrum resi` by sequence position.
    - In a multi-model NMR PDB each model is one state; PyMOL overlays display by state by default; to "view only frame N" use `frame N`.
    - This template defaults to a single frame degrading to a single state (for demo purposes); a real NMR ensemble requires a multi-model PDB.
