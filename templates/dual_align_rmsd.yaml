meta:
  name: dual_align_rmsd
  title: Dual-structure overlay align + RMSD (expected vs predicted / WT vs mutant)
  scene: Load two structures (self-overlay demo of the same PDB, or real alignment of two different PDBs), align by CA to compute RMSD, overlay-display both structures as cartoon (distinguished color + translucent). Suitable for RMSD spectra / mutation comparison / different conformations of the same gene.
  reference: "Adapted from PyMolClaw align.py, rewritten for the 2.5.0 strict API"
  created: 2026-09-19
  created_by: user-sedimented

params:
  pdb1: "structure1.pdb"
  pdb2: "structure2.pdb"
  name1: "s1"             # object naming (avoid reserved words: do not use a/b etc.)
  name2: "s2"
  align_ca: true          # align by CA
  align_cutoff: 5.0
  color1: lightblue
  color2: salmon
  transparency2: 0.5
  hide_water: true
  hide_hetatm: true
  background: white
  ambient: 0.5
  two_sided_lighting: 1
  ray_trace_mode: 1
  ray_shadows: 1
  antialias: 2
  depth_cue: 0
  ray_trace_gain: 0.1
  orthoscopic: 1
  cartoon_fancy_helices: 1
  cartoon_smooth_loops: 1
  cartoon_flat_sheets: 1
  cartoon_highlight_color: "grey50"
  save_width: 1600
  save_ratio: 1.0
  dpi: 300

render:
  description: |
    No molpub class, direct cmd (see dual_align_rmsd.py reference implementation):
    1. cmd.load(pdb1, name1); cmd.load(pdb2, name2); load validation count_atoms("all")>0
    2. align name2 CA, name1 CA (RMSD = return value; cutoff={align_cutoff})
    3. white bg soft light param set
    4. remove resn HOH; hide everything, hetatm; hide everything (per-object)
    5. show cartoon, name1 + name2; color {color1} name1 elem C; color {color2} name2 elem C
    6. set cartoon_transparency {transparency2}, name2
    7. orient name1; ray; png dpi=300
    8. mol.stop()
  entry_class: null
  extra_steps: |
    - **2.5.0 pitfall (hit)**: object names must not use reserved words (`a`/`b` etc.) -- `cmd.load(pdb, "b")` gets an underscore appended, becoming `b_`; use safe names like `s1`/`s2`.
    - `hide` selection **does not use the `or` operator** (2.5.0 strict mode "Invalid Operator"); per-object `hide("everything", "s1")` + `hide("everything", "s2")`.
    - `cmd.align` returns an RMSD tuple (`(rmsd, n_atoms, ...)`); the first element is the RMSD value.
    - Self-overlay of the same PDB gives RMSD=0 (for demo); a real comparison needs two PDBs.
