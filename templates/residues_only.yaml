meta:
  name: residues_only
  title: Key-residue stick close-up (protein completely hidden, only specified residue sticks shown)
  scene: The entire protein is completely hidden; only a few key residues (catalytic site / mutation site / binding site) are shown as soft pastel sticks, white bg soft light. Ideal for highlighting local key residues and focusing the viewer's eye.
  reference: "User-sedimented .pml recipe (protein hidden, only key-residue sticks; the original recipe_5_residues_only.pml is not distributed within this skill)"
  created: 2026-09-18
  created_by: user-sedimented

params:
  object: "{mol}"
  # Key-residue list: each item = [selection string, colour name]. Selections support resi 35 / A/35 / chain A+resi 12 etc., may carry chain prefixes.
  key_residues:
    - [ "resi 35", "sh_pink" ]
    - [ "resi 52", "sh_blue" ]
    - [ "resi 62", "sh_lav" ]
    - [ "resi 63", "sh_cream" ]
  # Soft pastel palette (values adjustable / colour names addable/removable; key_residues reference the colour names here)
  custom_colors:
    sh_pink:  [0.91, 0.73, 0.76]
    sh_blue:  [0.67, 0.75, 0.86]
    sh_lav:   [0.80, 0.76, 0.86]
    sh_cream: [0.98, 0.93, 0.80]
  hide_water: true
  hide_hetatm: true
  hide_protein: true          # key: hide the entire protein cartoon, keep only residue sticks
  stick_radius: 0.24
  stick_ball: 1
  stick_ball_ratio: 1.6
  background: white
  ambient: 0.45
  two_sided_lighting: 1
  ray_trace_mode: 1
  ray_shadows: 1
  antialias: 2
  depth_cue: 0
  ray_trace_gain: 0.1
  orthoscopic: 1
  # composition aligned to key residues (recipe uses zoom ... 4 to bring closer)
  focus_zoom_level: 4
  save_width: 1600
  save_ratio: 1.0
  dpi: 300

render:
  description: |
    No molpub class, direct cmd (see residues_only.py reference implementation):
    1. cmd.load object m; set_color 4 soft pastel colours
    2. White bg + soft-light parameter group (bg_color + set ambient/two_sided_lighting/ray_shadows/...)
    3. Stick parameters: set stick_radius / stick_ball / stick_ball_ratio
    4. Clear stage: remove resn HOH; hide everything, hetatm; hide everything
       (the entire protein cartoon is hidden accordingly — the key point of this recipe's "sticks-only" design)
    5. For each key residue, select ki; merge the ki selections into a string, show sticks; colour each one
    6. orient + zoom(key-residue string, level); ray; png dpi=300
    7. mol.stop()
  entry_class: null
  extra_steps: |
    - This recipe belongs to the "sticks-only" family, distinct from the ss/pastel "cartoon + shell" family: the protein body is completely hidden.
    - key_residues selections can be added/removed/recoloured as needed; chain-prefixed syntax `A/35` or `chain A and resi 35`.
    - If key residues are far apart, orient+zoom aligns to the nearest cluster; to centre, reduce focus_zoom_level (closer) / remove zoom.
    - Colouring shares the ss family pastels but leans "soft single-residue" (sh_* prefix), to avoid confusion with ss soft_blue/rose_pink.
