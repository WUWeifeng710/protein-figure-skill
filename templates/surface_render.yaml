meta:
  name: surface_render
  title: Molecular surface rendering (surface / mesh / dots, per-chain color + translucent)
  scene: Standalone molecular-surface style -- the whole structure as surface (or mesh/dots), per-chain color + translucent, white bg soft light. Suitable for showing molecular surface shape / binding pockets / protein surface.
  reference: "Adapted from PyMolClaw surface.py, rewritten for the 2.5.0 strict API"
  created: 2026-09-19
  created_by: user-sedimented

params:
  object: "{mol}"
  surface_style: surface    # surface / mesh / dots
  # Per-chain color (use 2.5.0 built-in colors, to avoid the cross-instance custom color "Unknown color" pitfall)
  chain_colors:
    A: lightblue
    B: lightorange
  transparency: 0.4
  hide_water: true
  hide_hetatm: true
  background: white
  ambient: 0.5
  two_sided_lighting: 1
  ray_trace_mode: 1
  ray_shadows: 1
  antialias: 2
  depth_cue: 0
  ray_trace_gain: 0.1
  orthoscopic: 1
  cartoon_fancy_helices: 1
  cartoon_smooth_loops: 1
  cartoon_flat_sheets: 1
  cartoon_highlight_color: "grey50"
  save_width: 1600
  save_ratio: 1.0
  dpi: 300

render:
  description: |
    No molpub class, direct cmd (see surface_render.py reference implementation):
    1. cmd.load; load validation count_atoms("all")>0
    2. white bg soft light param set
    3. remove resn HOH; hide everything, hetatm; hide everything
    4. show {surface_style}, m (surface / mesh / dots)
    5. per-chain color (use built-in colors lightblue/lightorange); set transparency {transparency}
    6. orient m; ray; png dpi=300
    7. mol.stop()
  entry_class: null
  extra_steps: |
    - **2.5.0 pitfall (hit)**: `set surface_quality 20` reports "Unknown color" (surface_quality validation misbehaves in 2.5.0 strict mode); simply do not set this parameter and use the default surface precision.
    - **Per-chain coloring must use 2.5.0 built-in colors** (lightblue/lightorange/salmon etc.); custom gs_* colors must be defined with set_color within the same PyMOL instance, across instances they become "Unknown color".
    - To color the surface by B-factor, use `cmd.spectrum("b","blue_white_red","m")` (when the PDB has a b column); 2.5.0 does not recognize the `bfactor` slot name.
    - Unlike ss_milky/ss_frosted's "cartoon + shell": this template **only** does the surface, no cartoon overlay.
