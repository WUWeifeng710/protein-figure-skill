meta:
  name: nature_highlight
  title: Nature highlight composite structure figure
  scene: Single-structure multi-chain highlight, emphasising key regions (binding site / mutation / segment), paired with a neutral surface + active cartoon, ideal for the main Figure in a paper.
  reference: "PyMOL-PUB cases/case_1.py (1AY7 / 1F34 highlight figures)"
  created: 2026-09-18
  created_by: agent-authored

params:
  manuscript_format: Nature
  cache_contents:
    - "residue:HOH"
  representation_plan:
    - ["{chain_A}", "surface"]
    - ["{chain_B}", "cartoon"]
  closed_surface: true
  independent_color: true
  rotate: [330, 10, 270]
  coloring_plan:
    - ["{chain_A}", "0xF2F2F2"]
    - ["{chain_B}", "0x2D2F82"]
    - ["{highlight_ranges}", "0xF08080"]   # highlight segments; caller fills in per the actual PDB
  save_width: 1280
  save_ratio: 0.9
  dpi: 300

render:
  description: |
    1. HighlightStructureImage(structure_paths=[pdb])
    2. set_cache(cache_contents)
    3. set_shape(representation_plan, independent_color=True, closed_surface=True)
    4. set_state(rotate)
    5. set_color(coloring_plan)
    6. save(save_path, width, ratio, dpi=300)
    7. close()
  entry_class: HighlightStructureImage
  extra_steps: |
    Optional add-on: obtain_widget_icon to generate rotation / arrow widget PNGs, for embedding into the layout figure.
