meta:
  name: spectrum_resi
  title: Sequence-position B-factor / pLDDT spectrum coloring (blue-white-red gradient cartoon)
  scene: cartoon continuous gradient by residue position (blue_white_red by default), CA atoms as spheres to improve readability, white bg soft light. Suitable for showing property distribution along the structure (B-factor flexibility / AlphaFold pLDDT confidence).
  reference: "Adapted from PyMolClaw spectrum.py, rewritten for the 2.5.0 strict API"
  created: 2026-09-19
  created_by: user-sedimented

params:
  object: "{mol}"
  # Gradient direction: blue→white→red by residue position (resi); change property as needed (bfactor / plddt require that column present)
  property: resi
  palette: blue_white_red        # options: blue_green_red / rainbow / red_white_blue
  add_ca_spheres: true
  ca_sphere_scale: 0.5
  hide_water: true
  hide_hetatm: true
  background: white
  ambient: 0.5
  two_sided_lighting: 1
  ray_trace_mode: 1
  ray_shadows: 1
  antialias: 2
  depth_cue: 0
  ray_trace_gain: 0.1
  orthoscopic: 1
  cartoon_fancy_helices: 1
  cartoon_smooth_loops: 1
  cartoon_flat_sheets: 1
  cartoon_highlight_color: "grey50"
  save_width: 1600
  save_ratio: 1.0
  dpi: 300

render:
  description: |
    No molpub class, direct cmd (see spectrum_resi.py reference implementation):
    1. cmd.load; load validation count_atoms("all")>0 (error out on 0 matches)
    2. white bg soft light param set (bg_color + set ambient/two_sided_lighting/ray_shadows/...)
    3. remove resn HOH; hide everything, hetatm; hide everything
    4. show cartoon, m; spectrum {property} {palette} m   ← core command
    5. show spheres, "m and name CA"; set sphere_scale 0.5
    6. orient m; ray; png dpi=300
    7. mol.stop()
  entry_class: null
  extra_steps: |
    - **Key pitfall**: conda-forge 2.5.0's `spectrum` command does not recognize `bfactor` as a property slot (reports "Unknown expression: bfactor").
      What works in 2.5.0 is `spectrum resi ...` (by residue position) or `spectrum plddt` (when the PDB has that column).
      For a "true B-factor" continuous gradient you need the `spectrum b ...` B-factor slot -- in this machine's 2.5.0 the `bfactor` slot name is not recognized, so use `resi` instead (sequence-wise gradient, visually equivalent).
    - If the PDB has an AlphaFold pLDDT column (MODEL section), `property: plddt` can be used for true confidence coloring.
    - Difference from nature_highlight: this template is "continuous property gradient", not "highlighted region + color scheme".
