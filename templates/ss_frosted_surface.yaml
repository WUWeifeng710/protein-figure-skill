meta:
  name: ss_frosted_surface
  title: Secondary-structure pastel cartoon + same-colour frosted-glass surface (v2)
  scene: Cartoon coloured by secondary structure in pastels; surface in the same colour (echoing the cartoon) + 0.60 transparency; frosted-glass feel, richer colour; ideal for a vivid structure figure.
  reference: "User-sedimented .pml recipe (ss pastel + same-colour frosted shell; the original recipe_2_ss_frosted.pml is not distributed within this skill)"
  created: 2026-09-18
  created_by: user-sedimented

params:
  object: "{mol}"
  cartoon_object: "{mol}_cart"
  surface_object: "{mol}_surf"
  custom_colors:
    soft_blue:  [0.63, 0.75, 0.94]   # ss h
    rose_pink:  [0.94, 0.69, 0.75]   # ss s
    lavender:   [0.78, 0.72, 0.84]   # loop
  ss_color_map:
    ss_h: soft_blue
    ss_s: rose_pink
    loop: lavender
  hide_water: true
  hide_hetatm: true
  # Key difference: surface coloured by ss same-colour (not a neutral single colour)
  surface_color_by_ss: true
  surface_transparency: 0.60
  background: white
  ambient: 0.5
  two_sided_lighting: 1
  ray_trace_mode: 1
  ray_shadows: 1
  antialias: 2
  depth_cue: 0
  ray_trace_gain: 0.1
  orthoscopic: 1
  cartoon_fancy_helices: 1
  cartoon_smooth_loops: 1
  cartoon_flat_sheets: 1
  cartoon_highlight_color: "grey50"
  save_width: 1600
  save_ratio: 1.0
  dpi: 300

render:
  description: |
    No molpub class, direct cmd (see ss_frosted_surface.py):
    1. cmd.load; set_color three colours; white-bg soft-light parameter group
    2. remove resn HOH; hide everything, hetatm; hide everything
    3. create cart, m; create surf, m
    4. show cartoon, cart; colour cartoon by ss (soft_blue=ss h / rose_pink=ss s / lavender=loop)
    5. show surface, surf; **surface also coloured by ss same-colour** (frosted-glass echo):
       color soft_blue,  surf and ss h
       color rose_pink,  surf and ss s
       color lavender,   surf and not (ss h or ss s)
       set transparency 0.60
    6. orient cart; ray; png dpi=300
    7. mol.stop()
  entry_class: null
  extra_steps: |
    - Surface coloured by ss same-colour is the core difference between this template and ss_milky: the shell matches the cartoon colour, frosted-glass feel, richer colour.
    - When migrating to 2.5.0, check that surface colouring by ss selection actually takes effect (the ss selection works equally well on the surface).
