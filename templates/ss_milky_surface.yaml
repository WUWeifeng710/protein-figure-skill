meta:
  name: ss_milky_surface
  title: Secondary-structure pastel cartoon + milky translucent surface (v1)
  scene: Cartoon coloured by secondary structure (helix/strand/loop) in pastel tones; surface neutral gray90 + 0.60 transparency; white bg soft light; ideal for highlighting secondary structure + a soft white shell.
  reference: "User-sedimented .pml recipe (ss pastel + neutral shell; the original recipe_1_ss_milky.pml is not distributed within this skill)"
  created: 2026-09-18
  created_by: user-sedimented

params:
  object: "{mol}"
  cartoon_object: "{mol}_cart"
  surface_object: "{mol}_surf"
  custom_colors:
    soft_blue:  [0.63, 0.75, 0.94]   # ss h (alpha helix)
    rose_pink:  [0.94, 0.69, 0.75]   # ss s (beta strand)
    lavender:   [0.78, 0.72, 0.84]   # loop (not h/s)
  # Secondary structure -> colour mapping (by ss selection, no chain split needed)
  ss_color_map:
    ss_h: soft_blue
    ss_s: rose_pink
    loop: lavender          # selection = object and not (ss h or ss s)
  hide_water: true
  hide_hetatm: true
  surface_color: "gray90"
  surface_transparency: 0.60
  background: white
  ambient: 0.5
  two_sided_lighting: 1
  ray_trace_mode: 1
  ray_shadows: 1
  antialias: 2
  depth_cue: 0
  ray_trace_gain: 0.1
  orthoscopic: 1
  cartoon_fancy_helices: 1
  cartoon_smooth_loops: 1
  cartoon_flat_sheets: 1
  cartoon_highlight_color: "grey50"
  save_width: 1600
  save_ratio: 1.0
  dpi: 300

render:
  description: |
    No molpub class, direct cmd (see ss_milky_surface.py reference implementation):
    1. cmd.load object; set_color three colours (soft_blue/rose_pink/lavender)
    2. White-bg soft-light parameter group (bg_color + set ambient/two_sided_lighting/ray_shadows/cartoon_fancy_helices etc.)
    3. remove resn HOH; hide everything, hetatm; hide everything
    4. create cart, m; create surf, m
    5. show cartoon, cart; colour by ss:
       color soft_blue,  cart and ss h
       color rose_pink,  cart and ss s
       color lavender,   cart and not (ss h or ss s)
    6. show surface, surf; color gray90; set transparency 0.60
    7. orient cart; ray; png dpi=300
    8. mol.stop()
  entry_class: null
  extra_steps: |
    - ss selections (ss h / ss s / loop) are PyMOL built-in selections; they work fine when migrating to 2.5.0.
    - Surface is a neutral single colour (gray90), consistent with the "milky shell" style of ss_milky.
    - Difference from ss_frosted: this template's surface is a single neutral colour; ss_frosted's surface is the same colour as the ss (a richer frosted-glass look).
    - Difference from ss_only: this template has a surface shell; ss_only is pure cartoon with no surface.
