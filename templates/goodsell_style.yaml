meta:
  name: goodsell_style
  title: Goodsell 风格平面化粉彩球（按链分色，无阴影柔光）
  scene: 球状模型按链上 Goodsell 粉彩（gs_blue/gs_red/gs_green/gs_tan/gs_orange），白底、无阴影、高 ambient、低 reflect 的"平面化"渲染，适合期刊封面级科学插图。
  reference: "参考 PyMolClaw goodsell.py，改写到 2.5.0 严格 API"
  created: 2026-09-19
  created_by: 用户沉淀

params:
  object: "{mol}"
  # 按链分色（自定义粉彩，可增删链）
  chain_colors:
    A: "gs_blue"
    B: "gs_red"
    C: "gs_green"
    D: "gs_tan"
  # Goodsell 粉彩调色板（Goodsell 风格典型色值）
  custom_colors:
    gs_blue:   [0.565, 0.714, 0.812]
    gs_red:    [0.855, 0.475, 0.427]
    gs_green:  [0.631, 0.792, 0.596]
    gs_tan:    [0.871, 0.812, 0.682]
    gs_orange: [0.871, 0.639, 0.376]
  representation: spheres      # spheres / surface
  hide_water: true
  hide_hetatm: true
  background: white
  # Goodsell 平面化渲染参数（与柔光柔化系不同，是 flat / no-shadow）
  ray_trace_mode: 3
  ray_trace_color: black
  ray_trace_gain: 0
  ambient: 1.0
  direct: 0.0
  reflect: 0.0
  ray_shadows: 0
  depth_cue: 0
  orthoscopic: 1
  save_width: 1600
  save_ratio: 1.0
  dpi: 300

render:
  description: |
    不走 molpub 类，直接 cmd（见 goodsell_style.py 参考实现）：
    1. cmd.load；加载校验 count_atoms("all")>0
    2. 白底 + Goodsell 平面化渲染参数一组（ray_trace_mode=3 / ambient=1.0 / direct=0 / reflect=0 / ray_shadows=0）
    3. set_color 5 色 Goodsell 粉彩（gs_blue/gs_red/gs_green/gs_tan/gs_orange）
    4. remove resn HOH；hide everything, hetatm；hide everything
    5. show spheres, m（或 surface）；按链 color gs_*
    6. orient m；ray；png dpi=300
    7. mol.stop()
  entry_class: null
  extra_steps: |
    - Goodsell 风格核心：flat / no-shadow / 高 ambient（1.0）/ 零 reflect，区别于我们的"柔光柔化"系（ambient 0.5 + 影子）。
    - 自定义色 gs_* 必须在同一 PyMOL 实例内 set_color 定义后再用（跨实例会 "Unknown color"，已踩坑）。
    - 按链分色时 chain_colors 只写目标 PDB 实际存在的链（1AY7 只有 A/B）。
    - 想要"封面级"可再叠 `cmd.set("ray_opaque_background", 1)` 保白底。
