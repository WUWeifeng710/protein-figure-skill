meta:
  name: goodsell_style
  title: Goodsell-style flat pastel spheres (chain-colored, no-shadow soft light)
  scene: A spherical model chain-colored with Goodsell pastels (gs_blue/gs_red/gs_green/gs_tan/gs_orange), white background, no-shadow, high ambient, low reflect "flattened" rendering. Suitable for journal-cover-grade scientific illustration.
  reference: "Adapted from PyMolClaw goodsell.py, rewritten for the 2.5.0 strict API"
  created: 2026-09-19
  created_by: user-sedimented

params:
  object: "{mol}"
  # Per-chain color (custom pastels; chains can be added/removed)
  chain_colors:
    A: "gs_blue"
    B: "gs_red"
    C: "gs_green"
    D: "gs_tan"
  # Goodsell pastel palette (typical Goodsell-style color values)
  custom_colors:
    gs_blue:   [0.565, 0.714, 0.812]
    gs_red:    [0.855, 0.475, 0.427]
    gs_green:  [0.631, 0.792, 0.596]
    gs_tan:    [0.871, 0.812, 0.682]
    gs_orange: [0.871, 0.639, 0.376]
  representation: spheres      # spheres / surface
  hide_water: true
  hide_hetatm: true
  background: white
  # Goodsell flat rendering params (differs from the soft-light family; this is flat / no-shadow)
  ray_trace_mode: 3
  ray_trace_color: black
  ray_trace_gain: 0
  ambient: 1.0
  direct: 0.0
  reflect: 0.0
  ray_shadows: 0
  depth_cue: 0
  orthoscopic: 1
  save_width: 1600
  save_ratio: 1.0
  dpi: 300

render:
  description: |
    No molpub class, direct cmd (see goodsell_style.py reference implementation):
    1. cmd.load; load validation count_atoms("all")>0
    2. white background + Goodsell flat rendering param set (ray_trace_mode=3 / ambient=1.0 / direct=0 / reflect=0 / ray_shadows=0)
    3. set_color 5 Goodsell pastels (gs_blue/gs_red/gs_green/gs_tan/gs_orange)
    4. remove resn HOH; hide everything, hetatm; hide everything
    5. show spheres, m (or surface); per-chain color gs_*
    6. orient m; ray; png dpi=300
    7. mol.stop()
  entry_class: null
  extra_steps: |
    - Goodsell-style core: flat / no-shadow / high ambient (1.0) / zero reflect, distinct from our "soft-light" family (ambient 0.5 + shadows).
    - Custom colors gs_* must be defined with set_color within the same PyMOL instance before use (across instances they become "Unknown color", already hit).
    - When coloring per chain, chain_colors should only list chains that actually exist in the target PDB (1AY7 has only A/B).
    - For a "cover-grade" look, additionally layer `cmd.set("ray_opaque_background", 1)` to keep the white background.
