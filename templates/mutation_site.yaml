meta:
  name: mutation_site
  title: Mutation-site structural analysis (single-residue sticks + CA spheres + environment cartoon + color distinction)
  scene: Specify a mutation residue, take the surrounding environment within an `around` radius as a translucent cartoon, render the mutation residue as sticks + CA spheres, with hue distinction (lightorange / red), white bg soft light. Suitable for WT vs mutant comparison and mutation effect localization.
  reference: "Adapted from PyMolClaw mutation.py, rewritten for the 2.5.0 strict API"
  created: 2026-09-19
  created_by: user-sedimented

params:
  object: "{mol}"
  mut_residue: 35          # mutation residue number (modify per the target PDB)
  env_cutoff: 5.0         # environment radius (Å)
  color_mut_site: lightorange
  color_mut_carbon: red
  env_cartoon_transparency: 0.6
  add_spheres: true
  sphere_scale: 0.6
  hide_water: true
  hide_hetatm: true
  background: white
  ambient: 0.5
  two_sided_lighting: 1
  ray_trace_mode: 1
  ray_shadows: 1
  antialias: 2
  depth_cue: 0
  ray_trace_gain: 0.1
  orthoscopic: 1
  cartoon_fancy_helices: 1
  cartoon_smooth_loops: 1
  cartoon_flat_sheets: 1
  cartoon_highlight_color: "grey50"
  focus_zoom: 8
  save_width: 1600
  save_ratio: 1.0
  dpi: 300

render:
  description: |
    No molpub class, direct cmd (see mutation_site.py reference implementation):
    1. cmd.load; load validation count_atoms("all")>0
    2. white bg soft light param set
    3. remove resn HOH; hide everything, hetatm; hide everything
    4. select mut_site ({object} and resi {mut_residue}); select context (byres around {env_cutoff}, excluding mut_site)
    5. show cartoon, context; set cartoon_transparency 0.6
    6. show sticks, "sc. and (mut_site)"; show spheres, "n. CA and (mut_site)"; set sphere_scale 0.6
    7. color {color_mut_site}, mut_site; color {color_mut_carbon}, "{object} and resi {mut_residue} and elem C"
    8. hide the unselected portion (m and not (mut_site or context))
    9. orient mut_site; zoom mut_site, focus_zoom; ray; png dpi=300
    10. mol.stop()
  entry_class: null
  extra_steps: |
    - This template is a "single-residue mutation" close-up; for a WT vs mut dual-structure comparison, use the `align` template overlay + highlight both mut_site.
    - The `byres` selection must be done after `hide("everything")` (hide clears the selection, same pitfall as active_site_highlight).
    - The mutation residue number must correspond to a residue actually present in the target PDB (validate with count_atoms).
