meta:
  name: rmsd_compare
  title: Dual-structure RMSD / residue property comparison figure
  scene: Two models (expected vs predicted, or wild-type vs mutant) overlaid and aligned; a rainbow gradient + putty-cartoon thickness encodes the per-residue differences; ideal for structure comparison / RMSD spectra.
  reference: "PyMOL-PUB cases (PropertyStructureImage RMSD example)"
  created: 2026-09-18
  created_by: agent-authored

params:
  manuscript_format: Science
  structure_paths:
    - "{expected_pdb}"
    - "{predicted_pdb}"
  representation_plan:
    - ["model:{predicted}", "cartoon"]
    - ["model:{expected}", "cartoon"]
  inner_align: true
  align_target: "{expected}"
  rotate: [0, 60, 255]
  color_target: "model:{predicted}"
  color_map: rainbow
  initial_color: "0xAAAAAA"
  edge_color: "0x000000"
  gauge_strengthen: true   # putty cartoon; larger residue-property difference = thicker cartoon
  properties: null         # optional: list of per-atom property values (one-to-one with the selected atoms); null = use the built-in count
  save_width: 1800
  save_ratio: 0.5
  dpi: 300

render:
  description: |
    1. PropertyStructureImage(structure_paths=[expected, predicted])
    2. set_shape(representation_plan)
    3. set_state(rotate, inner_align=True, target=align_target)
    4. set_color(target=color_target, properties=properties, color_map=color_map,
                 edge_color=edge_color, gauge_strengthen=True)
    5. save(save_path, width, ratio, dpi=300)
    6. close()
  entry_class: PropertyStructureImage
  extra_steps: |
    - properties=null uses the built-in count spectrum (per-residue count); when per-atom values are provided, they must be one-to-one (length == number of selected atoms).
    - gauge_strengthen only takes effect on the cartoon representation; no effect on surface/stick.
