meta:
  name: rmsd_compare
  title: 双结构 RMSD / 残基属性对比图
  scene: 两个模型（expected vs predicted 或 wild-type vs mutant）叠合对齐，用 rainbow 渐变 + putty cartoon 粗细表达残基差异，适合结构对比 / RMSD 谱图。
  reference: "PyMOL-PUB cases（PropertyStructureImage RMSD 示例）"
  created: 2026-09-18
  created_by: 我自建

params:
  manuscript_format: Science
  structure_paths:
    - "{expected_pdb}"
    - "{predicted_pdb}"
  representation_plan:
    - ["model:{predicted}", "cartoon"]
    - ["model:{expected}", "cartoon"]
  inner_align: true
  align_target: "{expected}"
  rotate: [0, 60, 255]
  color_target: "model:{predicted}"
  color_map: rainbow
  initial_color: "0xAAAAAA"
  edge_color: "0x000000"
  gauge_strengthen: true   # putty cartoon，残基属性差异越大 cartoon 越粗
  properties: null         # 可选：逐原子属性值列表（与选区原子一一对应）；null 则用内置 count
  save_width: 1800
  save_ratio: 0.5
  dpi: 300

render:
  description: |
    1. PropertyStructureImage(structure_paths=[expected, predicted])
    2. set_shape(representation_plan)
    3. set_state(rotate, inner_align=True, target=align_target)
    4. set_color(target=color_target, properties=properties, color_map=color_map,
                 edge_color=edge_color, gauge_strengthen=True)
    5. save(save_path, width, ratio, dpi=300)
    6. close()
  entry_class: PropertyStructureImage
  extra_steps: |
    - properties=null 时走内置 count 谱（按残基计数）；提供逐原子值时一一对应（长度必须 == 选区原子数）。
    - gauge_strengthen 只对 cartoon 生效，surface/stick 无效果。
